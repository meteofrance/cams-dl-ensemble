name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    env:
      PYTHONPATH: '.'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Gather Python changed files
      id: changed-py-files
      uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
      with:
        files: |
          cams/**/*.py
          script/**/*.py

    - name: Lint with ruff
      if: steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        pip install ruff==0.15.9
        ruff format --check ${STEPS_CHANGED_PY_FILES_OUTPUTS_ALL_CHANGED_FILES}
        ruff check ${STEPS_CHANGED_PY_FILES_OUTPUTS_ALL_CHANGED_FILES}
      env:
        STEPS_CHANGED_PY_FILES_OUTPUTS_ALL_CHANGED_FILES: ${{ steps.changed-py-files.outputs.all_changed_files }}

  tests:
    env:
      PYTHONPATH: '.'
      SCIPY_ARRAY_API: 1
    runs-on: ubuntu-22.04
    container:
      image: pytorch/pytorch:2.10.0-cuda12.6-cudnn9-devel@sha256:df80e10d07cd114c5f33380e3df7b6c5a3caab8481f68509ea652a7c0908316e

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Install git  # necessary for the tj-action/changed-py-files
      run: apt-get update && apt-get install -y git

    - name: Gather Python changed files
      id: changed-py-files
      uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
      with:
        files: |
          *.py
          **/*.py

    - name: Type hinting with pyright on changed files
      if: steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        uv run pyright ${STEPS_CHANGED_PY_FILES_OUTPUTS_ALL_CHANGED_FILES}
      env:
        STEPS_CHANGED_PY_FILES_OUTPUTS_ALL_CHANGED_FILES: ${{ steps.changed-py-files.outputs.all_changed_files }}

    - name: Test with pytest
      if: steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        uv run pytest --cov=cams --cov=scripts --cov-fail-under=95 tests/
