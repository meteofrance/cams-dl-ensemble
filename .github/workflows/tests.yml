name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    env:
      PYTHONPATH: '.'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Gather Python changed files
      id: changed-py-files
      uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
      with:
        files: |
          *.py
          **/*.py

    - name: Lint with ruff
      if: steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        pip install ruff
        ruff format --check ${{ steps.changed-py-files.outputs.all_changed_files }}
        ruff check ${{ steps.changed-py-files.outputs.all_changed_files }} --select I

    - name: docstr coverage on source
      uses: KlexosNYC/docstr-coverage-action@v1.4
      with:
        source_dir: cams
        fail_under: 100
        skip_magic: true
        skip_init: false
        skip_file_doc: true
        skip_private: false
        skip_class_def: false
        accept_empty: false

    - name: docstr coverage on scripts
      uses: KlexosNYC/docstr-coverage-action@v1.4
      with:
        source_dir: scripts
        fail_under: 100
        skip_magic: true
        skip_init: false
        skip_file_doc: false
        skip_private: false
        skip_class_def: false
        accept_empty: false

  tests:
    env:
      PYTHONPATH: '.'
    container:
      image: pytorch/pytorch:2.10.0-cuda12.6-cudnn9-devel

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
        run: |
          pip install . pyright pytest pytest-cov --break-system-packages
          
    - name: Install git  # necessary for the tj-action/changed-py-files
      run: apt-get update && apt-get install -y git

    - name: Gather Python changed files
      id: changed-py-files
      uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
      with:
        files: |
          *.py
          **/*.py

    - name: Type hinting with pyright on changed files
      if: steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        pyright ${{ steps.changed-py-files.outputs.all_changed_files }}

    - name: Test with pytest
      if: steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        pytest --cov=cams --cov=scripts --cov-fail-under=85 tests/
