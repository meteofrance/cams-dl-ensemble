# lightning.pytorch==2.6.1
seed_everything: 666
trainer:
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      save_dir: /tmp/cams_tests/
      experiment_name: dummy
      run_name: seed_666
      log_model: True
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "{epoch:02d}-{val_loss:.2f}"
        monitor: val_loss
        mode: min
        save_top_k: 1    # Save the best model
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: mfai.pytorch.callbacks.MLFlowSystemMonitorCallback
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 2
  log_every_n_steps: 1

model:
  learning_rate: 0.0001
  model:
    class_path: mfai.pytorch.models.half_unet.HalfUNet
    init_args:
      in_channels: 2  # 2 stats fields computed from 11 CAMS models
      out_channels: 1
      input_shape:
        - 64
        - 64
      settings:
        num_filters: 8
        autopad_enabled: True
  loss:
    class_path: torch.nn.MSELoss
  training_mode: residual  # y = f(x) + x

data:
  batch_size: 2
  num_workers: 1
  prefetch_factor: 2
  num_days_in_val_set: 10
  processed_dir: /scratch/shared/cams/o3_15h_SOL/processed
  transforms:
    - class_path: cams.transforms.ExtractInputStatisticalFeatures
      init_args:
        statistic_types:
          - median
          - amax