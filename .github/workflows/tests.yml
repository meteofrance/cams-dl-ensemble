name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    env:
      PYTHONPATH: '.'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Gather Python changed files
      id: changed-py-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          *.py
          **/*.py
          pyproject.toml

    - name: Lint with ruff
      if: steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        pip install ruff==0.15.9
        ruff format --check ${{ steps.changed-py-files.outputs.all_changed_files }}
        ruff check ${{ steps.changed-py-files.outputs.all_changed_files }}

  tests:
    env:
      PYTHONPATH: '.'
      SCIPY_ARRAY_API: 1
    runs-on: ubuntu-22.04
    container:
      image: pytorch/pytorch:2.10.0-cuda12.6-cudnn9-devel@sha256:df80e10d07cd114c5f33380e3df7b6c5a3caab8481f68509ea652a7c0908316e

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install git  # necessary for the checkout and changed-py-files actions
      run: apt-get update && apt-get install -y git

    - name: Gather Python changed files
      if: github.event_name == 'pull_request'
      id: changed-py-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          *.py
          **/*.py
          pyproject.toml

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0
      if: github.event_name != 'pull_request' || steps.changed-py-files.outputs.any_changed == 'true' 
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Install git  # necessary for the tj-action/changed-py-files
      run: apt-get update && apt-get install -y git

    - name: Gather Python changed files
      id: changed-py-files
      uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
      with:
        files: |
          *.py
          **/*.py

    - name: Type hinting with pyright on changed files
      if: github.event_name != 'pull_request' || steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        uv run pyright

    - name: Test with pytest
      if: github.event_name != 'pull_request' || steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        uv run pytest --cov=cams --cov=scripts --cov-fail-under=95 tests/
